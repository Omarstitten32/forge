name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libprotobuf-dev protobuf-compiler libfmt-dev libspdlog-dev libeigen3-dev libcli11-dev catch2

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFORGE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/forge-tests
